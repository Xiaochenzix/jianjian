name: Publish successful build to Release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Build Jianjian run ID'
        required: true
        type: string
      tag:
        description: 'Existing Release tag'
        required: true
        default: 'v0.4.1'
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify build and publish its artifacts
        run: python scripts/promote-ci-release.py
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
