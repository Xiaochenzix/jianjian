<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>剪剪 · 悬浮窗</title>
  <link rel="stylesheet" href="floating.css">
  <script src="floating.js" defer></script>
</head>
<body>
  <header class="titlebar">
    <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 5h14v11H9l-4 3V5Z"/><path d="M9 9h6M9 12h4"/></svg></div>
    <div class="title-group"><h1>剪剪<span>悬浮窗</span></h1><div id="connection" class="connection"><i aria-hidden="true"></i><span id="connection-text">正在连接</span></div></div>
    <button id="open-main" class="icon-button" type="button" title="打开主界面" aria-label="打开主界面"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5h6v6M19 5l-9 9M10 5H5v14h14v-5"/></svg></button>
    <button id="hide-window" class="icon-button close-button" type="button" title="隐藏悬浮窗，继续后台同步" aria-label="隐藏悬浮窗"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
  </header>
  <section id="login-state" class="empty-state" hidden>
    <span class="empty-symbol" aria-hidden="true">剪</span><h2>消息，随手就能看到</h2><p>在主界面登录，即可与其他设备实时同步。</p><button id="login-button" class="primary" type="button">打开主界面登录</button>
  </section>
  <main id="chat" class="chat" hidden>
    <div class="history-note">最近 50 条 · 完整记录可在主界面查看</div>
    <div class="conversation">
      <div id="scroller" class="scroller" tabindex="0" aria-label="同步消息记录">
        <div id="empty-state" class="empty-state"><span class="empty-symbol" aria-hidden="true">↔</span><h2 id="empty-title">正在获取消息</h2><p id="empty-description">消息与剪贴板，随时在这里接着用。</p><button id="retry-load" class="text-button" type="button" hidden>重新加载</button></div>
        <div id="timeline" class="timeline" aria-label="最近消息"></div>
      </div>
      <button id="latest-button" class="latest-button" type="button" hidden>↓ 最新消息</button>
    </div>
    <form id="compose" class="composer">
      <label class="sr-only" for="message-input">发送文字到其他设备</label>
      <textarea id="message-input" rows="2" maxlength="32768" placeholder="发送到我的设备…" spellcheck="false"></textarea>
      <div class="compose-footer"><span>Enter 发送 · Shift + Enter 换行</span><button id="send-button" class="primary" type="submit" disabled>发送</button></div>
    </form>
  </main>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
